name: Rebuild screener data

on:
  schedule:
    # Every Saturday at 09:00 UTC (markets closed — avoids intraday noise)
    - cron: "0 9 * * 6"
  workflow_dispatch: {}   # lets you trigger a rebuild manually from the Actions tab

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run data pipeline
        run: |
          python backend/build_data.py \
            --max-tickers 800 \
            --pe-history-limit 300 \
            --years 5

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          git diff --staged --quiet && echo "No data changes." || git commit -m "Refresh screener data"
          git push
